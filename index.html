<style>

:root{
    --ivory:#F5F1EA;
    --gold:#C8A24D;
    --dark-gold:#A97825;
    --pink:#E9C2C8;
    --olive:#75624D;
    --text:#3A342E;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--ivory);
    color:var(--text);
    font-family:'Lora', serif;
    min-height:100vh;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
}

.container{
    max-width:1000px;
    width:100%;
    text-align:center;
}

.logo{
    max-width:650px;
    width:90%;
    margin:0 auto 50px;
}

.logo img{
    width:100%;
    height:auto;
}

.tagline{
    font-family:'Cormorant Garamond', serif;
    font-size:3rem;
    color:var(--dark-gold);
    margin-bottom:25px;
    line-height:1.2;
}

.description{
    max-width:700px;
    margin:0 auto 40px;
    font-size:1.15rem;
    line-height:1.8;
    color:#5f5549;
}

.divider{
    color:var(--gold);
    font-size:1.5rem;
    margin:30px 0;
}

.button{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(
        135deg,
        var(--gold),
        #e2bf67
    );
    color:white;
    padding:16px 36px;
    border-radius:50px;
    font-size:1rem;
    transition:.3s ease;
}

.button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.footer{
    margin-top:60px;
    color:#8b7a63;
    font-size:.95rem;
}

.bloom{
    color:var(--pink);
}

@media(max-width:768px){

.tagline{
    font-size:2.2rem;
}

.description{
    font-size:1rem;
}

}

</style>
