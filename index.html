<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakhyia | Launching Soon</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Georgia, serif;
            background:#f8f4ed;
            color:#6a583e;
            min-height:100vh;
        }

        .logo-banner{
            width:100%;
            background:#f8f4ed;
            text-align:center;
            padding:20px 0;
        }

        .logo-banner img{
            width:50%;
            max-width:1400px;
            height:auto;
            display:block;
            margin:0 auto;
        }

        .content{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:60px 20px;
        }

        .coming-soon{
            font-size:3rem;
            color:#9c7840;
            margin-bottom:20px;
            letter-spacing:2px;
        }

        .divider{
            width:120px;
            height:2px;
            background:#b6925a;
            margin:20px auto 30px;
        }

        .tagline{
            font-size:1.4rem;
            color:#7b5c2e;
            margin-bottom:25px;
        }

        .message{
            max-width:700px;
            font-size:1.1rem;
            line-height:1.8;
            color:#666;
        }

        @media (max-width:768px){
            .coming-soon{
                font-size:2.2rem;
            }

            .tagline{
                font-size:1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="logo-banner">
        <img src="Logo.jpg" alt="Sakhyia Logo">
    </div>

    <div class="content">
        <h1 class="coming-soon">Launching Soon</h1>

        <div class="divider"></div>

        <p class="tagline">
            Woven in Friendship, Where Traditions Bloom.
        </p>

        <p class="message">
            Our website is currently under development. We are crafting
            a beautiful experience that celebrates tradition, friendship,
            and timeless elegance. Stay tuned for our official launch.
        </p>
    </div>

</body>
</html>
